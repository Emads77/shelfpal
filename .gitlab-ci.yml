stages: [lint, test, build]

backend-lint:
  stage: lint
  image: python:3.12
  before_script:
    - cd backend
    - pip install ruff
  script:
    - ruff check .
    - ruff format --check .

frontend-lint:
  stage: lint
  image: node:22
  before_script:
    - cd frontend
    - npm ci
  script:
    - npx oxlint
    - npx prettier --check .

backend-test:
  stage: test
  image: python:3.12
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_DB: shelfpal_test
    POSTGRES_USER: shelfpal
    POSTGRES_PASSWORD: ci_password
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  before_script:
    - cd backend
    - pip install -r requirements.txt
  script:
    - python manage.py test

.build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE:$CI_COMMIT_SHORT_SHA" -t "$IMAGE:$CI_COMMIT_REF_SLUG" "$CONTEXT"
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main" 

backend-build:
  extends: .build-image
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/backend
    CONTEXT: backend

frontend-build:
  extends: .build-image
  variables:
    IMAGE: $CI_REGISTRY_IMAGE/frontend
    CONTEXT: frontend
